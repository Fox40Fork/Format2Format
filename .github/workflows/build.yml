name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      INNO_VERSION: 7.1.0
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test -c Release

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/Format2Format -p:PublishProfile=win-x64

      - name: Smoke test - right-click menu registration
        run: ./build/smoke-tests.ps1 -Test Registration -Exe publish/win-x64/Format2Format.exe

      - name: Smoke test - single window for several files
        run: ./build/smoke-tests.ps1 -Test SingleInstance -Exe publish/win-x64/Format2Format.exe

      - name: Build installer
        run: |
          $nupkg = Join-Path $env:RUNNER_TEMP 'innosetup.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/tools.innosetup/$env:INNO_VERSION/tools.innosetup.$env:INNO_VERSION.nupkg" -OutFile $nupkg
          Expand-Archive $nupkg -DestinationPath (Join-Path $env:RUNNER_TEMP 'innosetup')
          & (Join-Path $env:RUNNER_TEMP 'innosetup/tools/ISCC.exe') installer/Format2Format.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Smoke test - install and uninstall
        run: ./build/smoke-tests.ps1 -Test Installer -Setup (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName

      - name: Collect log on failure
        if: failure()
        run: Copy-Item (Join-Path $env:LOCALAPPDATA 'Format2Format') -Destination app-log -Recurse -ErrorAction SilentlyContinue

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format2format-log
          path: app-log/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Format2Format-setup
          path: dist/*.exe
